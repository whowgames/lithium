<VirtualHost 0.0.0.0:80>
	ServerName lithium.v2
    DocumentRoot /home
    AddType application/x-httpd-php .php

    ErrorLog /home/docker-logs/error_log
    php_admin_value error_log /home/docker-logs/php_log
    php_value session.save_path /var/tmp/lithium/sessions
    php_value upload_tmp_dir /var/tmp/lithium/uploads

    php_admin_value open_basedir "/home/:/dev/urandom"
    php_value include_path ".:/usr/share/php/"
    DirectoryIndex index.php index.html index.htm

    <Location />
      SetOutputFilter DEFLATE
      BrowserMatch ^Mozilla/4 gzip-only-text/html
      BrowserMatch ^Mozilla/4\.0[678] no-gzip
      BrowserMatch \bMSI[E].7 !no-gzip !gzip-only-text/html
      SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|swf|mp3|zip|rar|mpe?g|avi|dcr|dxr|cst|cct|cxt|fgd|swa|w3d|exe|dat|js|json)$ no-gzip dont-vary
      Header append Vary User-Agent env=!dont-vary
      FileETag None
    </Location>

    Header set Access-Control-Allow-Origin "*"

    php_admin_value xdebug.max_nesting_level 900
    php_admin_flag short_open_tag on

    <Directory "/home/">
        RewriteEngine on
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !favicon.ico$
        RewriteRule ^ index.php [QSA,L]
    </Directory>
</VirtualHost>
